name: Project validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Roblox tools
        uses: paradoxum-games/setup-rokit@29e6ee09651a3711e3a287a1037671d7b74db6d0 # v3
        with:
          cache: true
      - name: Check Luau formatting
        run: stylua --check src
      - name: Lint Luau
        run: selene src
      - name: Build Rojo project
        run: rojo build default.project.json -o "$RUNNER_TEMP/supermarket-chaos.rbxlx"
      - name: Validate Rojo project JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project = json.loads(Path("default.project.json").read_text())
          assert project["name"] == "SupermarketChaos"
          assert project["tree"]["$className"] == "DataModel"
          PY
      - name: Validate documentation index targets
        run: |
          python - <<'PY'
          from pathlib import Path

          docs = Path("docs")
          required = [
              "README.md",
              "PROJECT_STATUS.md",
              "BACKLOG.md",
              "requirements/PRODUCT_REQUIREMENTS.md",
              "requirements/TRACEABILITY.md",
              "design/GAME_DESIGN.md",
              "design/FIRST_SESSION.md",
              "design/VISUAL_DESIGN_BIBLE.md",
              "architecture/ARCHITECTURE.md",
              "security/THREAT_MODEL.md",
              "operations/BEGINNER_SETUP.md",
              "operations/QUALITY.md",
              "operations/PHASE74_REPRODUCIBLE_CI.md",
          ]
          missing = [str(docs / path) for path in required if not (docs / path).is_file()]
          assert not missing, f"Missing docs: {missing}"
          PY
